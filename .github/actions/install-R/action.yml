name: 'Install R'
description: 'Installs R and necessary dependencies'

runs:
  using: "composite"
  steps:
    - name: Install R, make and gcc (to compile the C .Call shims)
      shell: bash
      run: |
        pacman -Sy --needed --noconfirm r make gcc
        pacman -Scc --noconfirm

    - name: Show R version for reproducibility
      shell: bash
      run: R --version
