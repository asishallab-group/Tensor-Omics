name: 'Run Tests'
description: 'Runs all Fortran, R and Python Tests for a certain Fortran compiler'

on:
  workflow_call:
    inputs:
      compiler:
        description: 'The Fortran compiler to run the tests with (ifx, gfortran)'
        required: true
        type: string
      ref:
        description: 'The git ref (branch, tag, commit SHA) to run the tests on'
        required: true
        type: string
      extra_build_args:
        description: 'Extra flags to pass to the build script, like --skip-kinds-test or --max-performance'
        type: string

jobs:
  run_tests:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      # ifx (-qopenmp) and nvfortran (-stdpar) thread every `do concurrent` on their own, which
      # would nest inside the OpenMP root loops (#218), so src/ uses plain `do` loops. A grep on
      # the statement's start: a label or a construct name may precede it; comments are skipped.
      - name: Refuse do concurrent in src/
        run: |
          status=0
          matches=$(grep -rniE '^[[:space:]]*([0-9]+[[:space:]]+)?([a-z][a-z0-9_]*[[:space:]]*:[[:space:]]*)?do[[:space:]]*,?[[:space:]]*concurrent([^a-z0-9_]|$)' src) || status=$?
          if [ "$status" -eq 0 ]; then
            while IFS=: read -r file line _; do
              echo "::error file=$file,line=$line::do concurrent is not used here (#218), write a plain do"
            done <<< "$matches"
            exit 1
          fi
          [ "$status" -eq 1 ] || exit 2

      - name: Install Fortran Compiler
        uses: ./.github/actions/install-Fortran
        with:
          compiler: ${{ inputs.compiler }}

      # --skip-code-generation: neither Python nor ford is installed yet at this point, and the
      # generated sources are committed, so a build here compiles the tree as it stands. The
      # final step below installs the generator and checks that that is still the right tree.
      - name: Run Fortran Tests
        run: bash test_runner.sh ${{ inputs.extra_build_args }} --skip-code-generation --compiler="${{ inputs.compiler }}"

      - name: Install R
        uses: ./.github/actions/install-R

      # `status` rather than a bare loop: a loop exits with the status of its *last* iteration,
      # so a suite that fails anywhere but at the end passes the step silently.
      - name: Run R Tests
        run: |
          bash build.sh ${{ inputs.extra_build_args }} --skip-code-generation --compiler="${{ inputs.compiler }}"
          status=0
          for i in r/test/*.[rR]; do echo ; echo $i ; Rscript $i || status=1 ; done
          exit $status

      - name: Install Python
        uses: ./.github/actions/install-Python
        with:
          packages: numpy pandas

      - name: Run Python Tests
        run: |
          status=0
          for i in python/test/*.py; do echo ; echo $i ; python $i || status=1 ; done
          exit $status

      - name: Ensure the code generator doesn't need to be run.
        run: |
          pip install ford
          python helper/generate_code.py --check
