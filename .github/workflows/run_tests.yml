name: 'Run Tests'
description: 'Runs all Fortran, R and Python Tests for a certain Fortran compiler'

on:
  workflow_call:
    inputs:
      compiler:
        description: 'The Fortran compiler to run the tests with (ifx, gfortran)'
        required: true
        type: string
      ref:
        description: 'The git ref (branch, tag, commit SHA) to run the tests on'
        required: true
        type: string
      extra_build_args:
        description: 'Extra flags to pass to the build script, like --skip-kinds-test or --max-performance'
        type: string

jobs:
  run_tests:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Install Fortran Compiler
        uses: ./.github/actions/install-Fortran
        with:
          compiler: ${{ inputs.compiler }}

      # --skip-code-generation: neither Python nor ford is installed yet at this point, and the
      # generated sources are committed, so a build here compiles the tree as it stands. The
      # final step below installs the generator and checks that that is still the right tree.
      - name: Run Fortran Tests
        run: bash test_runner.sh ${{ inputs.extra_build_args }} --skip-code-generation --compiler="${{ inputs.compiler }}"

      - name: Install R
        uses: ./.github/actions/install-R

      - name: Run R Tests
        run: |
          bash build.sh ${{ inputs.extra_build_args }} --skip-code-generation --compiler="${{ inputs.compiler }}"
          for i in r/test/*.[rR]; do echo ; echo $i ; Rscript $i ; done

      - name: Install Python
        uses: ./.github/actions/install-Python
        with:
          packages: numpy pandas

      - name: Run Python Tests
        run: for i in python/test/*.py; do echo ; echo $i ; python $i ; done

      - name: Ensure the code generator doesn't need to be run.
        run: |
          pip install ford
          python helper/generate_code.py --check
