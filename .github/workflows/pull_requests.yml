name: 'Workflow related to Pull Requests'
description: 'Triggers all workflows needed for Pull Requests'

run-name: 'PR ${{ github.event.pull_request.number }}, Author: ${{ github.actor }}, PR-Title: ${{ github.event.pull_request.title }}, Commit: ${{ github.event.pull_request.head.sha }}'

on:
  pull_request:
    paths:
      - .github/workflows/pull_requests.yml
      - .github/workflows/run_tests.yml
      - .github/actions/install-Python/*
      - .github/actions/install-Fortran/*
      - .github/actions/install-R/*
      - helper/**
      - r/**
      - python/**
      - src/**
      - test/**
      - test_runner.sh
      - build.sh
      - build_utils.sh
      - fpm.toml

jobs:
  run_tests:
    strategy:
      matrix:
        compiler: [ifx, gfortran]
        max_performance_flag: [--max-performance, --diagnostics]
    uses: ./.github/workflows/run_tests.yml
    with:
      compiler: ${{ matrix.compiler }}
      extra_build_args: ${{ matrix.max_performance_flag }}

      # This is the commit of the PR branch head
      ref: ${{ github.event.pull_request.head.sha }}

  # #218: the code uses no `do concurrent`. ifx threads every one once OpenMP is on, nested
  # inside the parallel root loops, so a plain `do` is written instead. The awk pass reads
  # statements, not lines: it drops comments and string contents, joins `&` continuations
  # and splits at `;`, so a statement label, a construct name or a continuation between the
  # keywords does not hide one, and a comment or a string does not count.
  no_do_concurrent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fail on a do concurrent statement in src/
        run: |
          statements='
            function report(   n, pieces, i) {
              n = split(statement, pieces, ";")
              for (i = 1; i <= n; i++)
                if (tolower(pieces[i]) ~ /^[ \t]*([0-9]+[ \t]+)?([a-z][a-z0-9_]*[ \t]*:[ \t]*)?do([ \t]+[0-9]+)?[ \t]*,?[ \t]*concurrent([^a-z0-9_]|$)/) {
                  sub(/^[ \t]+/, "", statement)
                  print file ":" first_line ":" statement
                  break
                }
              statement = ""; quote = ""; continued = 0
            }
            FNR == 1 { if (statement != "") report(); statement = ""; quote = ""; continued = 0; file = FILENAME }
            /^[ \t]*#/ { next }
            {
              line = $0
              if (continued) {
                sub(/^[ \t]*/, "", line)
                if (substr(line, 1, 1) == "&") line = substr(line, 2); else line = " " line
              } else first_line = FNR
              code = ""; string_continues = 0
              for (i = 1; i <= length(line); i++) {
                c = substr(line, i, 1)
                if (quote != "") {
                  if (c == quote && substr(line, i + 1, 1) == quote) i++
                  else if (c == quote) { quote = ""; code = code c }
                  else if (c == "&" && substr(line, i + 1) ~ /^[ \t]*$/) { string_continues = 1; break }
                } else if (c == "!") break
                else { if (c == "\"" || c == "\047") quote = c; code = code c }
              }
              if (string_continues) continued = 1
              else if (code ~ /&[ \t]*$/) { sub(/&[ \t]*$/, "", code); continued = 1 }
              else if (continued && code ~ /^[ \t]*$/) next
              else continued = 0
              statement = statement code
              if (!continued) report()
            }
            END { if (statement != "") report() }'
          [ -d src ] || { echo "::error::no src/ to check"; exit 2; }
          status=0
          matches=$(find src -type f -exec awk "$statements" {} +) || status=$?
          if [ "$status" -ne 0 ]; then exit 2; fi
          if [ -n "$matches" ]; then
            while IFS=: read -r file line statement; do
              echo "::error file=$file,line=$line::do concurrent is not used here (#218), write a plain do: $statement"
            done <<< "$matches"
            exit 1
          fi
