name = "tensor-omics"
version = "0.1.0"
license = "MIT"

[install]
library = true

[library]
type = "shared"

[features]
unknown-compiler.build.link = ["loess-netlib", "loess-netlib-drotg", "xxhash", "zip", "lapack", "blas"]
gfortran.build.link = ["loess-netlib", "loess-netlib-drotg", "xxhash", "zip", "lapack", "blas"]
ifx.build.link = ["loess-netlib", "loess-netlib-drotg", "xxhash", "zip", "iomp5", "lapack", "blas"]

# nvfortran feature: nvfortran treats '\' in a character context as an escape by default,
# so -Mbackslash is required for correct JSON string escaping (see f42_json/serialize_string).
# This flag must apply to every nvfortran build (it is correctness, not optimization), hence it
# lives on the always-active nvfortran feature rather than under optimization/diagnostics.
# build.link is intentionally left out for now: nvfortran support is unverified (it currently
# rejects procedure calls inside do-concurrent loops), so completing the feature is deferred.
nvfortran.nvfortran.flags = "-Mbackslash"

optimization.ifx.flags = "-xHost -align array64byte -qopt-zmm-usage=high -qopt-prefetch=3 -qopt-matmul"
optimization.nvfortran.flags = "-Mconcur -fopenmp -stdpar=multicore"
optimization.gfortran.flags = "-march=native -mtune=native -fopenmp -funroll-loops -ftree-vectorize"

diagnostics.ifx.flags = "-g -traceback -check all -warn all -diag-enable=all"
diagnostics.gfortran.flags = "-g -fbacktrace -fcheck=all"

default.linux.flags = "-fPIC"

[[test]]
name = "run_tests"
source-dir = "test"
main = "run_tests.F90"

[extra.ford]
project = "TensorOmics"
output_dir = "doc"
license = "mit"
print_creation_date = true
creation_date = "%Y-%m-%d %H:%M %z"
preprocessor = "pcpp -D__GFORTRAN__ -I."
