name = "tensor_omics"
version = "0.1.0"
license = "MIT"

[install]
library = true

[library]
type = "shared"
# `#include <src/macros.h>` and `<authors.h>` resolve from the repository root. Stated here
# rather than as a build-script `-I.`, so fpm resolves it relative to the package -- which is
# also what a project depending on this one would need.
include-dir = ["."]

# The Fortran test framework (asserts, test_suite). A library of its own so that a suite in a
# subdirectory of test/ can use it: fpm lets a test source see only library modules and modules in
# its own directory or below. See test_framework/fpm.toml.
[dev-dependencies]
test_framework = { path = "test_framework" }

[features]
unknown-compiler.build.link = ["loess-netlib", "loess-netlib-drotg", "xxhash", "zip"]
gfortran.build.link = ["loess-netlib", "loess-netlib-drotg", "xxhash", "zip"]
ifx.build.link = ["loess-netlib", "loess-netlib-drotg", "xxhash", "zip", "iomp5"]
nvfortran.build.link = ["loess-netlib", "loess-netlib-drotg", "xxhash", "zip"]

optimization.ifx.flags = "-xHost -align array64byte -qopt-zmm-usage=high -qopt-prefetch=3 -qopt-matmul"
optimization.nvfortran.flags = "-Mconcur -fopenmp -stdpar=multicore"
optimization.gfortran.flags = "-march=native -mtune=native -fopenmp -funroll-loops -ftree-vectorize"

diagnostics.ifx.flags = "-g -traceback -check all -warn all -diag-enable=all -stand f23"
diagnostics.gfortran.flags = "-g -fbacktrace -fcheck=all -Wall -Wextra -Warray-temporaries -Wrealloc-lhs-all -std=f2023 -pedantic"

default.linux.flags = "-fPIC"
# nvfortran treats a backslash in a string as a C escape unless told otherwise; standard Fortran,
# gfortran and ifx treat it as an ordinary character (`"\"` is one character long).
# nvfortran flushes subnormal numbers to zero unless told otherwise, and then writes them as 0
# (the JSON writer, f42_serde_json_serialize, would lose them); -Kieee -Mnoflushz keep them.
# nvfortran 26.9 or later is required: 25.7 miscompiles the JSON writer's class(*) arguments.
default.nvfortran.flags = "-Mbackslash -Kieee -Mnoflushz"

# fpm links the root library against every package it knows, the test_framework dev-dependency
# included and even without --tests (resolve_target_linking in fpm_targets.f90). Without these
# flags, libtensor_omics.so would record a NEEDED libtest_framework.so that it never uses, and
# the Python and R bindings could not load it. The linker keeps only libraries something
# references.
default.linux.link-time-flags = "-Wl,--as-needed"
default.macos.link-time-flags = "-Wl,-dead_strip_dylibs"
# ifx's -traceback prints its frames through libgcc_s's unwinder, which no object references, so
# --as-needed drops it: a runtime error then prints "You must link with libunwind" instead of the
# file and line. So the diagnostics build links it outside --as-needed.
diagnostics.ifx.linux.link-time-flags = "-Wl,--push-state,--no-as-needed -lgcc_s -Wl,--pop-state"

# Above -O0, ifx reassociates floating-point expressions by default, across parentheses too. Code
# whose accuracy depends on evaluation order then silently loses it: f42's log1p came out as the
# naive log(1 + x). So every ifx build respects parentheses, as the Fortran standard asks and as
# gfortran does by default. -fp-model precise also rules out the other value-changing rewrites
# (reordered sums, division by a rounded reciprocal), so ifx results match gfortran's instead of
# differing by a few ulps. Measured on 10 workloads: no cost on 9, k-means 2.2x slower (its
# 12-dimension sum of squares may no longer be split for vectorization).
default.ifx.flags = "-assume protect_parens -fp-model precise"

# gfortran must never get -ffast-math, -ffinite-math-only or -Ofast, here or through
# --override-flags. They let it assume that no Inf or NaN exists, and it then folds ieee_is_nan and
# ieee_is_finite to constants: the input validation stops rejecting NaN and Inf, and every other
# test for an Inf or NaN result disappears, without a warning.

[[test]]
name = "run_tests"
source-dir = "test"
main = "run_tests.F90"

[extra.ford]
project = "TensorOmics"
output_dir = "doc"
license = "mit"
print_creation_date = true
creation_date = "%Y-%m-%d %H:%M %z"
preprocessor = "pcpp -D__GFORTRAN__ -I."
